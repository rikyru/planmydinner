<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan My Dinner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
      }
    </script>
</head>
<body>
    <div id="app">
        <nav>
            <a @click="page = 'today'" :class="{active: page === 'today'}">Oggi</a>
            <a @click="page = 'dashboard'" :class="{active: page === 'dashboard'}">Settimana</a>
            <a @click="page = 'import'" :class="{active: page === 'import'}">Importa</a>
            <a @click="page = 'shopping'" :class="{active: page === 'shopping'}">Lista Spesa</a>
            <a @click="page = 'pantry'" :class="{active: page === 'pantry'}">Dispensa</a>
            <a @click="page = 'profiles'" :class="{active: page === 'profiles'}">Profili</a>
        </nav>

        <main>
            <today-view v-if="page === 'today'"></today-view>
            <dashboard v-if="page === 'dashboard'"></dashboard>
            <import-wizard v-if="page === 'import'"></import-wizard>
            <shopping-list v-if="page === 'shopping'"></shopping-list>
            <pantry v-if="page === 'pantry'"></pantry>
            <profiles v-if="page === 'profiles'"></profiles>
        </main>
    </div>

    <script type="module">
        import { createApp } from 'vue';
        import TodayView from './today.js';
        import Dashboard from './dashboard.js';
        import ImportWizard from './import.js';
        import ShoppingList from './shopping.js';
        import Pantry from './pantry.js';
        import Profiles from './profiles.js';

        const app = {
            data() {
                return {
                    page: 'today'
                }
            },
            components: {
                TodayView,
                Dashboard,
                'import-wizard': ImportWizard,
                ShoppingList,
                Pantry,
                Profiles,
            }
        };

        createApp(app).mount('#app');
    </script>
</body>
</html>
