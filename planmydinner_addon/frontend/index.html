<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Plan My Dinner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
    <meta name="theme-color" content="#f6f5ef" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131712" media="(prefers-color-scheme: dark)">
    <script>
        // Tema: applica subito la scelta salvata (prima del paint, evita flash).
        // ?theme=light|dark forza e salva la scelta (utile per test/kiosk).
        (() => {
            try {
                const q = new URLSearchParams(location.search).get('theme');
                if (q === 'light' || q === 'dark') localStorage.setItem('pmd_theme', q);
                const t = localStorage.getItem('pmd_theme');
                if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
            } catch {}
        })();
    </script>
    <link rel="stylesheet" href="style.css?v=26">
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
      }
    </script>
</head>
<body>
    <div id="app">
        <nav class="top-nav">
            <span class="brand">🍽️ <b class="brand-text">Plan My Dinner</b></span>
            <div class="top-nav__links">
                <a v-for="p in pages" :key="p.id" @click="page = p.id" :class="{active: page === p.id}">
                    {{ p.icon }} {{ p.label }}
                </a>
            </div>
            <button class="theme-toggle" @click="toggleTheme" :title="theme === 'dark' ? 'Tema chiaro' : 'Tema scuro'">
                {{ theme === 'dark' ? '☀️' : '🌙' }}
            </button>
        </nav>

        <main>
            <today-view v-if="page === 'today'"></today-view>
            <week-view v-if="page === 'dashboard'"></week-view>
            <import-wizard v-if="page === 'import'"></import-wizard>
            <shopping-list v-if="page === 'shopping'"></shopping-list>
            <pantry v-if="page === 'pantry'"></pantry>
            <profiles v-if="page === 'profiles'"></profiles>
            <recipes v-if="page === 'recipes'"></recipes>
            <settings-view v-if="page === 'settings'"></settings-view>
            <history-view v-if="page === 'history'"></history-view>
        </main>

        <!-- Bottom nav (solo mobile) -->
        <nav class="bottom-nav">
            <a v-for="p in mainPages" :key="p.id" @click="page = p.id" :class="{active: page === p.id}">
                <span class="bn-icon">{{ p.icon }}</span><span class="bn-label">{{ p.label }}</span>
            </a>
            <a @click="moreOpen = true" :class="{active: isMorePage}">
                <span class="bn-icon">☰</span><span class="bn-label">Altro</span>
            </a>
        </nav>

        <!-- Sheet "Altro" (mobile) -->
        <div v-if="moreOpen" class="modal-overlay" @click.self="moreOpen = false">
            <div class="modal sheet-menu">
                <a v-for="p in morePages" :key="p.id" @click="page = p.id; moreOpen = false"
                   :class="{active: page === p.id}">
                    <span style="font-size:18px">{{ p.icon }}</span> {{ p.label }}
                </a>
            </div>
        </div>

        <!-- Toast container -->
        <div id="toast-container">
            <div v-for="t in toasts" :key="t.id" :class="['toast', t.type]">{{ t.msg }}</div>
        </div>
    </div>

    <script>
        // Compute the API base path from <base href> injected by the server.
        // When running behind HA ingress: base = "/api/hassio_ingress/TOKEN/ui/"
        // so _apiBase = "/api/hassio_ingress/TOKEN" (parent of /ui/).
        // In standalone mode: no <base> tag → _apiBase = "" and all fetch('/...') work as-is.
        window._apiBase = (() => {
            const base = document.querySelector('base');
            if (!base) return '';
            try {
                const p = new URL('..', base.href).pathname.replace(/\/$/, '');
                return p === '/' ? '' : p;
            } catch { return ''; }
        })();
        // Auth opzionale: se il backend ha API_KEY impostata, la chiave si passa
        // una volta con ?api_key=... nell'URL (salvata in localStorage) e viene
        // allegata a ogni chiamata API. Senza API_KEY lato server non cambia nulla.
        (() => {
            const k = new URLSearchParams(location.search).get('api_key');
            if (k) { try { localStorage.setItem('pmd_api_key', k); } catch {} }
        })();
        window.apiFetch = (path, opts = {}) => {
            let key = null;
            try { key = localStorage.getItem('pmd_api_key'); } catch {}
            if (key) opts = { ...opts, headers: { ...(opts.headers || {}), 'X-API-Key': key } };
            return fetch(window._apiBase + path, opts);
        };
    </script>
    <script type="module">
        import { createApp, reactive } from 'vue';
        import TodayView from './today.js?v=17';
        import WeekView from './planner.js?v=23';
        import ImportWizard from './import.js?v=11';
        import ShoppingList from './shopping.js?v=7';
        import Pantry from './pantry.js?v=3';
        import Profiles from './profiles.js?v=6';
        import Recipes from './recipes.js?v=8';
        import SettingsView from './settings.js?v=5';
        import HistoryView from './history.js?v=7';

        const toastState = reactive({ items: [] });

        function addToast(msg, type = 'info', duration = 3000) {
            const id = Date.now() + Math.random();
            toastState.items.push({ id, msg, type });
            setTimeout(() => {
                const idx = toastState.items.findIndex(t => t.id === id);
                if (idx !== -1) toastState.items.splice(idx, 1);
            }, duration);
        }

        const PAGES = [
            { id: 'today',     icon: '🍽️', label: 'Oggi',        main: true },
            { id: 'dashboard', icon: '📅', label: 'Settimana',    main: true },
            { id: 'shopping',  icon: '🛒', label: 'Spesa',        main: true },
            { id: 'recipes',   icon: '📖', label: 'Ricette',      main: true },
            { id: 'history',   icon: '📊', label: 'Storico' },
            { id: 'pantry',    icon: '🧺', label: 'Dispensa' },
            { id: 'import',    icon: '📥', label: 'Importa' },
            { id: 'profiles',  icon: '👥', label: 'Profili' },
            { id: 'settings',  icon: '⚙️', label: 'Impostazioni' },
        ];

        const app = createApp({
            data() {
                const stored = (() => { try { return localStorage.getItem('pmd_theme'); } catch { return null; } })();
                const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                // Deep-link: #dashboard, #shopping, ... aprono direttamente la vista
                const hash = location.hash.replace('#', '');
                return {
                    page: PAGES.some(p => p.id === hash) ? hash : 'today',
                    toasts: toastState.items,
                    pages: PAGES,
                    moreOpen: false,
                    theme: stored || system,
                };
            },
            watch: {
                page(val) { try { history.replaceState(null, '', '#' + val); } catch {} },
            },
            mounted() {
                window.addEventListener('hashchange', () => {
                    const h = location.hash.replace('#', '');
                    if (PAGES.some(p => p.id === h)) this.page = h;
                });
            },
            computed: {
                mainPages() { return this.pages.filter(p => p.main); },
                morePages() { return this.pages.filter(p => !p.main); },
                isMorePage() { return this.morePages.some(p => p.id === this.page); },
            },
            methods: {
                toggleTheme() {
                    this.theme = this.theme === 'dark' ? 'light' : 'dark';
                    document.documentElement.dataset.theme = this.theme;
                    try { localStorage.setItem('pmd_theme', this.theme); } catch {}
                },
            },
            components: { TodayView, WeekView, 'import-wizard': ImportWizard, ShoppingList, Pantry, Profiles, Recipes, SettingsView, HistoryView },
        });

        app.provide('toast', { add: addToast });
        app.mount('#app');
    </script>
</body>
</html>
