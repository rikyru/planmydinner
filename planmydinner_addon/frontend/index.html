<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan My Dinner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
    <link rel="stylesheet" href="style.css?v=14">
    <link rel="stylesheet" href="dashboard.css">
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
      }
    </script>
    <style>
        /* ---- Layout base ---- */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; background: #f8f9fa; color: #212529; }
        nav { display: flex; gap: 4px; padding: 8px 12px; background: #fff; border-bottom: 1px solid #dee2e6; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; }
        nav::-webkit-scrollbar { display: none; }
        nav a { padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; color: #495057; user-select: none; white-space: nowrap; flex-shrink: 0; }
        nav a:hover { background: #f1f3f5; }
        nav a.active { background: #4263eb; color: #fff; font-weight: 600; }
        main { padding: 16px; }
        @media (max-width: 600px) { main { padding: 10px 12px; } }

        /* ---- Stati comuni ---- */
        .loading { padding: 24px; text-align: center; color: #868e96; font-style: italic; }
        .loading::before { content: '⏳ '; }
        .error-box { background: #fff5f5; border: 1px solid #ffc9c9; border-radius: 8px; padding: 14px 18px; color: #c92a2a; margin: 12px 0; }
        .empty-box { background: #f8f9fa; border: 2px dashed #dee2e6; border-radius: 10px; padding: 32px; text-align: center; color: #868e96; }
        .empty-box p { margin: 0 0 12px; font-size: 15px; }

        /* ---- Bottoni ---- */
        button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 14px; font-size: 14px; }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-primary { background: #4263eb; color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #3451d1; }
        .btn-secondary { background: #e9ecef; color: #495057; }
        .btn-secondary:hover:not(:disabled) { background: #dee2e6; }
        .btn-danger { background: #fa5252; color: #fff; }

        /* ---- Modal ---- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal { background: #fff; border-radius: 12px; padding: 24px; width: min(480px, 95vw); max-height: 85vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
        .modal h3 { margin: 0 0 16px; font-size: 17px; }

        /* ---- Toast ---- */
        #toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
        .toast { padding: 12px 18px; border-radius: 8px; color: #fff; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.15); animation: slideIn .2s ease; min-width: 220px; }
        .toast.success { background: #2f9e44; }
        .toast.error   { background: #c92a2a; }
        .toast.info    { background: #1971c2; }
        @keyframes slideIn { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }

        /* ---- Misc ---- */
        input, select { padding: 8px 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; width: 100%; }
        input:focus, select:focus { outline: none; border-color: #4263eb; box-shadow: 0 0 0 2px rgba(66,99,235,.2); }
    </style>
</head>
<body>
    <div id="app">
        <nav>
            <a @click="page = 'today'" :class="{active: page === 'today'}">Oggi</a>
            <a @click="page = 'dashboard'" :class="{active: page === 'dashboard'}">Settimana</a>
            <a @click="page = 'import'" :class="{active: page === 'import'}">Importa</a>
            <a @click="page = 'shopping'" :class="{active: page === 'shopping'}">Lista Spesa</a>
            <a @click="page = 'pantry'" :class="{active: page === 'pantry'}">Dispensa</a>
            <a @click="page = 'profiles'" :class="{active: page === 'profiles'}">Profili</a>
            <a @click="page = 'recipes'" :class="{active: page === 'recipes'}">Ricette</a>
            <a @click="page = 'settings'" :class="{active: page === 'settings'}">Impostazioni</a>
        </nav>

        <main>
            <today-view v-if="page === 'today'"></today-view>
            <week-view v-if="page === 'dashboard'"></week-view>
            <import-wizard v-if="page === 'import'"></import-wizard>
            <shopping-list v-if="page === 'shopping'"></shopping-list>
            <pantry v-if="page === 'pantry'"></pantry>
            <profiles v-if="page === 'profiles'"></profiles>
            <recipes v-if="page === 'recipes'"></recipes>
            <settings-view v-if="page === 'settings'"></settings-view>
        </main>

        <!-- Toast container -->
        <div id="toast-container">
            <div v-for="t in toasts" :key="t.id" :class="['toast', t.type]">{{ t.msg }}</div>
        </div>
    </div>

    <script>
        // Compute the API base path from <base href> injected by the server.
        // When running behind HA ingress: base = "/api/hassio_ingress/TOKEN/ui/"
        // so _apiBase = "/api/hassio_ingress/TOKEN" (parent of /ui/).
        // In standalone mode: no <base> tag → _apiBase = "" and all fetch('/...') work as-is.
        window._apiBase = (() => {
            const base = document.querySelector('base');
            if (!base) return '';
            try {
                const p = new URL('..', base.href).pathname.replace(/\/$/, '');
                return p === '/' ? '' : p;
            } catch { return ''; }
        })();
        window.apiFetch = (path, opts) => fetch(window._apiBase + path, opts);
    </script>
    <script type="module">
        import { createApp, reactive } from 'vue';
        import TodayView from './today.js?v=5';
        import WeekView from './planner.js?v=13';
        import ImportWizard from './import.js?v=11';
        import ShoppingList from './shopping.js?v=7';
        import Pantry from './pantry.js?v=3';
        import Profiles from './profiles.js?v=6';
        import Recipes from './recipes.js?v=3';
        import SettingsView from './settings.js?v=2';

        const toastState = reactive({ items: [] });

        function addToast(msg, type = 'info', duration = 3000) {
            const id = Date.now() + Math.random();
            toastState.items.push({ id, msg, type });
            setTimeout(() => {
                const idx = toastState.items.findIndex(t => t.id === id);
                if (idx !== -1) toastState.items.splice(idx, 1);
            }, duration);
        }

        const app = createApp({
            data() {
                return { page: 'today', toasts: toastState.items };
            },
            components: { TodayView, WeekView, 'import-wizard': ImportWizard, ShoppingList, Pantry, Profiles, Recipes, SettingsView },
        });

        app.provide('toast', { add: addToast });
        app.mount('#app');
    </script>
</body>
</html>
