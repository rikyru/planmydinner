<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan My Dinner Configuration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
      }
    </script>
</head>
<body>
    <div id="app">
        <nav>
            <a @click="page = 'dashboard'">Dashboard</a>
            <a @click="page = 'pantry'">Pantry</a>
            <a @click="page = 'recipes'">Recipes</a>
            <a @click="page = 'import'">Import</a>
            <a @click="page = 'profiles'">Profiles</a>
            <a @click="page = 'planner'">Planner</a>
        </nav>
        
        <main>
            <dashboard v-if="page === 'dashboard'"></dashboard>
            <pantry v-if="page === 'pantry'"></pantry>
            <recipes v-if="page === 'recipes'"></recipes>
            <import-wizard v-if="page === 'import'"></import-wizard>
            <profiles v-if="page === 'profiles'"></profiles>
            <planner v-if="page === 'planner'"></planner>
        </main>
    </div>

    <script type="module">
        import { createApp } from 'vue';
        import Dashboard from './dashboard.js';
        import Pantry from './pantry.js';
        import Recipes from './recipes.js';
        import ImportWizard from './import.js';
        import Profiles from './profiles.js';
        import Planner from './planner.js';

        const app = {
            data() {
                return {
                    page: 'dashboard'
                }
            },
            components: {
                Dashboard,
                Pantry,
                Recipes,
                'import-wizard': ImportWizard,
                Profiles,
                Planner,
            }
        };

        createApp(app).mount('#app');
    </script>
</body>
</html>
