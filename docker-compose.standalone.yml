services:
  planmydinner:
    build: ./planmydinner_addon
    ports:
      - "8000:8000"
    volumes:
      - planmydinner_data:/data
    environment:
      - DATA_DIR=/data
    env_file:
      - path: .env
        required: false   # copia .env.example → .env per configurare LLM
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  planmydinner_data:
