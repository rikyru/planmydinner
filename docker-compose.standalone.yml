services:
  planmydinner:
    build: ./planmydinner_addon
    ports:
      - "8000:8000"
    volumes:
      - planmydinner_data:/data
    environment:
      - DATA_DIR=/data
    env_file:
      - path: .env
        required: false   # copia .env.example → .env per configurare LLM
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  planmydinner_data:
